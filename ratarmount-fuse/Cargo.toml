[package]
name = "ratarmount-fuse"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "FUSE layer for ratarmount-rs (fuser low-level)"
# `tests/fuse_rename_over.rs` is a `ratarmount` integration test (it needs
# `CARGO_BIN_EXE_ratarmount`). Cargo discovers that only as a package autotest,
# so disable discovery here. The binary crate lists the file as `[[test]]`.
autotests = false

[lib]

[dependencies]
ratarmount-core.workspace = true
ratarmount-compositing.workspace = true
libc.workspace = true
log.workspace = true
thiserror.workspace = true
tempfile.workspace = true
serde_json = "1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[target.'cfg(target_os = "linux")'.dependencies]
# ABI support is negotiated at runtime, including 7.40 for optional passthrough.
# Linux mounts through runtime-loaded libfuse3 in src/libfuse3.rs. Never enable
# fuser's libfuse feature here (test-portable-deps.sh and
# regression_portable_no_libfuse_needed guard the absence of a load-time link).
fuser = "0.18.0"

[target.'cfg(not(target_os = "linux"))'.dependencies]
# Other targets retain fuser's libfuse mounting backend.
fuser = { version = "0.18.0", features = ["libfuse"] }

[dev-dependencies]
rusqlite.workspace = true

[lints]
workspace = true
