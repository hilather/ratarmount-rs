[package]
name = "ratarmount-formats-sqlar"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "SQLAR (SQLite Archiver) mount source"
readme = "README.md"

[features]
default = []
# Open SQLCipher-encrypted SQLAR archives (`PRAGMA key` + PBKDF2-HMAC-SHA512).
# Links rusqlite with the SQLCipher amalgamation and vendored OpenSSL.
#
#   cargo build -p ratarmount-formats-sqlar --features sqlcipher
#   cargo test  -p ratarmount-formats-sqlar --features sqlcipher --lib
#
# See README.md and the crate-level docs in src/lib.rs.
sqlcipher = [
    "rusqlite/bundled-sqlcipher-vendored-openssl",
    "dep:pbkdf2",
    "dep:sha2",
]

[dependencies]
ratarmount-core.workspace = true
rusqlite.workspace = true
thiserror.workspace = true
log.workspace = true
libc.workspace = true
flate2 = "1"
pbkdf2 = { version = "0.12", optional = true, default-features = false, features = ["hmac"] }
sha2 = { version = "0.10", optional = true }

[dev-dependencies]
tempfile.workspace = true
