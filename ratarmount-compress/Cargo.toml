[package]
name = "ratarmount-compress"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Seekable compression backends for ratarmount-rs"

[features]
default = []
# Parallel gzip + IndexedReader via hilather/rapidgzip-rust (MSRV 1.87+ / edition 2024).
# Opt-in at open time: RATARMOUNT_GZIP_BACKEND=rapidgzip or --use-backend rapidgzip.
gzip-rapidgzip = ["dep:rapidgzip-core"]
# Sequential inflate via Intel ISA-L (requires shared libisal; see ISAL_INSTALL_PREFIX).
gzip-rapidgzip-isal = ["gzip-rapidgzip", "rapidgzip-core/isal"]
# Fault seams in the commit journal for other crates' tests (`commit_journal::fault`).
# Enabled only through dev-dependencies, never in a normal build.
test-hooks = []

[dependencies]
ratarmount-core.workspace = true
thiserror.workspace = true
flate2 = "1"
miniz_oxide = "0.8"
# Pure-Rust inflate for GZIDX hard restore (`set_dictionary` + optional bit residual).
# Cold G3 checkpoint build stays on miniz_oxide (state-clone path); do not switch flate2.
zlib-rs = "0.6"
# Prefer static/bundled so we do not need system -dev packages.
bzip2 = { version = "0.5", features = ["static"] }
xz2 = { version = "0.1", features = ["static"] }
zstd = "0.13"
tempfile.workspace = true
log.workspace = true
libc.workspace = true
crc32fast = "1"
sha2 = "0.10"
lz4_flex = "0.11"
lzma-rs = { version = "0.3", features = ["raw_decoder"] }
newtua-lzw-z = "0.1"
libloading = "0.8"
# Tier D POC: pure-Rust rapidgzip (path-backed IndexedReader). Pin v0.2.2 (ISA-L polish).
# crates.io 0.1.0 is an incomplete stub — do not use it.
rapidgzip-core = { git = "https://github.com/hilather/rapidgzip-rust.git", rev = "cea43efdb4fa8408e764a6b56d4e860f22b84ced", optional = true }

[lints]
workspace = true
