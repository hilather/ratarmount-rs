[package]
name = "ratarmount-remote"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Remote URL fetch (HTTP, S3, SSH/SFTP, WebDAV, SMB, Dropbox) for ratarmount-rs"

[dependencies]
ratarmount-core.workspace = true
thiserror.workspace = true
log.workspace = true
tempfile.workspace = true
ureq = { version = "2", default-features = true, features = ["tls"] }
url = "2"
ssh2 = { version = "0.9", features = ["vendored-openssl"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# Dropbox list_folder / metadata JSON (also used by other crates in the workspace).
serde_json = "1"
# Pre-landed for P-4 FTP (`suppaftp` rustls) and P-3 GCS ADC RS256 JWT.
# Unused until those inbound PRs `use` them. Do not add `native-tls`.
# 6.2.1+ rust-version is 1.80.1; pin 6.2.0 for workspace MSRV 1.74.
suppaftp = { version = "=6.2.0", default-features = false, features = ["rustls"] }
jsonwebtoken = "9"
