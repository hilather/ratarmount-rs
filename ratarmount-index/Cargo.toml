[package]
name = "ratarmount-index"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "SQLite index 0.7.0 read/write for ratarmount-rs"

[dependencies]
ratarmount-core.workspace = true
# Workspace rusqlite 0.32 has no `fts5` cargo feature. Bundled libsqlite3-sys
# always compiles `-DSQLITE_ENABLE_FTS5`, so FTS5 cannot be compiled out of
# this binary. Optional locate is the `files_fts` table + MATCH query.
rusqlite.workspace = true
thiserror.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log.workspace = true
sha2 = "0.10"
sha1 = "0.10"
md-5 = "0.10"
crc32fast = "1"
tempfile.workspace = true
ureq = { version = "2", default-features = true, features = ["tls"] }
# Compressed SQLite index materialization (Python `_load_index` / `_undo_compression`).
flate2 = "1"
xz2 = { version = "0.1", features = ["static"] }
zstd = "0.13"
bzip2 = { version = "0.5", features = ["static"] }

[dev-dependencies]
