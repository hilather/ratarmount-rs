name: muse-bump-lock
on:
  push:
    branches: [chore/release-v0.1.33]
    paths: ['.github/workflows/_muse_bump_lock.yml']
permissions:
  contents: write
jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/release-v0.1.33
      - name: Sync Cargo.lock path crates and remove this workflow
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations
          import re
          from pathlib import Path

          root = Path('.')
          cargo = (root / 'Cargo.toml').read_text()
          m = re.search(r'(?ms)^\[workspace\.package\]\s*(.*?)^\[', cargo + '\n[')
          if not m:
              raise SystemExit('missing [workspace.package]')
          vm = re.search(r'(?m)^version\s*=\s*"([^"]+)"', m.group(1))
          if not vm:
              raise SystemExit('missing workspace.package.version')
          want = vm.group(1)

          wm = re.search(r'(?ms)^\[workspace\]\s*(.*?)^\[', cargo + '\n[')
          arr = re.search(r'members\s*=\s*\[(.*?)\]', wm.group(1), re.S)
          members = {n.rsplit('/', 1)[-1] for n in re.findall(r'"([^"]+)"', arr.group(1))}

          lock_path = root / 'Cargo.lock'
          lock = lock_path.read_text()
          out = []
          bumped = 0
          for i, block in enumerate(lock.split('[[package]]\n')):
              if i == 0:
                  out.append(block)
                  continue
              lines = block.splitlines(keepends=True)
              name = ver = None
              source = False
              for line in lines:
                  if line.startswith('name = '):
                      name = line.split('=', 1)[1].strip().strip('"')
                  elif line.startswith('version = '):
                      ver = line.split('=', 1)[1].strip().strip('"')
                  elif line.startswith('source = '):
                      source = True
              if name in members and not source and ver != want:
                  new_lines = []
                  for line in lines:
                      if line.startswith('version = '):
                          new_lines.append(f'version = "{want}"\n' if line.endswith('\n') else f'version = "{want}"')
                          bumped += 1
                      else:
                          new_lines.append(line)
                  lines = new_lines
              out.append('[[package]]\n' + ''.join(lines))
          new_text = ''.join(out)
          lock_path.write_text(new_text)
          print(f'bumped {bumped} path packages to {want} ({len(members)} members)')
          if bumped == 0:
              raise SystemExit('no path packages needed bump — abort')
          PY
          bash packaging/test-workspace-lock-version.sh
          rm -f .github/workflows/_muse_bump_lock.yml
          git config user.name "hilather"
          git config user.email "hilather@gmail.com"
          git add Cargo.lock
          git add -u .github/workflows/_muse_bump_lock.yml
          git status
          git commit -m "Bump workspace version to 0.1.33 (Cargo.lock)" -m "— Muse"
          git push origin HEAD:chore/release-v0.1.33
