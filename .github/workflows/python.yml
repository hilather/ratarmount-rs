name: Python wheels

on:
  pull_request:
    paths:
      - 'ratarmount-*/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'packaging/audit_native_exports.py'
      - 'packaging/build-macos-deps.sh'
      - '.github/workflows/python.yml'
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_BUILD_JOBS: '4'
  UV_CACHE_DIR: ${{ github.workspace }}/.uv-cache

jobs:
  wheels:
    name: Wheel (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            manylinux: '2_28'
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            manylinux: '2_28'
          - runner: macos-15
            target: aarch64-apple-darwin
            manylinux: 'off'
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        if: runner.os == 'macOS'
        with:
          cache-suffix: ${{ matrix.runner }}
      # Homebrew's libarchive/xz/lz4 bottles on macos-15 need macOS 15, which
      # delocate-wheel rejects at the wheel's 14.0 target: build them (and
      # zstd) from pinned sources instead. See packaging/build-macos-deps.sh.
      - name: macOS build libraries
        if: runner.os == 'macOS'
        run: |
          brew install pkgconf
          echo "MACOSX_DEPLOYMENT_TARGET=14.0" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$HOME/macos-deps/lib/pkgconfig" >> "$GITHUB_ENV"
      - name: Cache macOS libarchive build
        if: runner.os == 'macOS'
        id: macos-deps
        uses: actions/cache@v4
        with:
          path: ~/macos-deps
          key: macos-deps-${{ matrix.runner }}-arm64-t14.0-libarchive3.8.11-xz5.8.4-lz4-1.10.0-zstd1.5.7-${{ hashFiles('packaging/build-macos-deps.sh') }}
      - name: Build libarchive, xz, lz4, zstd (cache miss)
        if: runner.os == 'macOS' && steps.macos-deps.outputs.cache-hit != 'true'
        run: ./packaging/build-macos-deps.sh build "$HOME/macos-deps"
      - name: Check macOS libarchive build
        if: runner.os == 'macOS'
        run: ./packaging/build-macos-deps.sh check "$HOME/macos-deps"
      - name: Build abi3 wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --manifest-path ratarmount-python/Cargo.toml --out dist --interpreter python3.12
          before-script-linux: yum install -y libarchive-devel zlib-devel perl-IPC-Cmd perl-core
      - name: Bundle macOS dynamic libraries
        if: runner.os == 'macOS'
        run: |
          uv venv --python python "$RUNNER_TEMP/repair-venv"
          uv pip install --python "$RUNNER_TEMP/repair-venv/bin/python" delocate
          "$RUNNER_TEMP/repair-venv/bin/delocate-wheel" --require-archs arm64 -w repaired dist/*.whl
          rm dist/*.whl
          mv repaired/*.whl dist/
      # The repaired wheel's _native may export no sqlite3_* symbol and only
      # the allowlisted entry points (#151, private-instance installation).
      - name: Audit wheel exports
        run: python -I packaging/audit_native_exports.py dist/*.whl
      - uses: actions/upload-artifact@v4
        with:
          name: python-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error

  embedding:
    # The rlib's Rust tests, including the _native publication gate and the
    # checked-open status (#151); the default workspace build compiles no PyO3.
    name: Rust embedding tests (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        # Every packaged Linux target runs the checked-open status natively.
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install system deps
        run: |
          sudo apt-get update -o Acquire::Retries=5
          sudo apt-get install -y -o Acquire::Retries=5 pkg-config libarchive-dev zlib1g-dev
      - name: cargo clippy (embedding, extension-module)
        # The workspace clippy uses default features and lints neither the
        # embedding tests nor the extension-module initializer.
        run: |
          cargo clippy -p ratarmount-python --features embedding --all-targets -- -D warnings
          cargo clippy -p ratarmount-python --features extension-module --lib -- -D warnings
      - name: cargo test --features embedding
        # The test binary links libpython (auto-initialize); point the loader at it.
        env:
          LD_LIBRARY_PATH: ${{ env.pythonLocation }}/lib
        run: cargo test -p ratarmount-python --features embedding --lib

  sdist:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --manifest-path ratarmount-python/Cargo.toml --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: python-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  test:
    name: Installed wheel (${{ matrix.target }}, Python ${{ matrix.python }})
    needs: wheels
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            python: '3.9'
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            python: '3.12'
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            python: '3.12'
          - runner: macos-15
            target: aarch64-apple-darwin
            python: '3.12'
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v6
        with:
          cache-suffix: ${{ runner.os == 'macOS' && matrix.runner || '' }}
      - uses: actions/download-artifact@v4
        with:
          name: python-${{ matrix.target }}
          path: dist
      - name: Install wheel in a fresh venv
        run: |
          uv venv --python python .wheel-venv
          uv pip install --python .wheel-venv/bin/python dist/*.whl pytest fsspec zstandard pyyaml pandas pyarrow webdataset datasets
      - name: Test installed package
        run: |
          .wheel-venv/bin/python -c 'import ratarmount_rs; assert "site-packages" in ratarmount_rs.__file__'
          .wheel-venv/bin/python -m pytest ratarmount-python/tests -ra
