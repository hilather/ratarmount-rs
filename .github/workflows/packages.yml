# Build distributable packages for Ubuntu (.deb), Rocky (.rpm), portable tarballs,
# macOS tarballs, and cosign keyless signatures for release artifacts.
#
# Matrix:
#   - Ubuntu 22.04, 24.04 — amd64
#   - Ubuntu 24.04 — arm64 (ubuntu-24.04-arm)
#   - Rocky Linux 8 — amd64 (container)
#   - Portable “oldest glibc” tarball — Debian bullseye (glibc 2.31) amd64 + arm64
#   - macOS arm64 (macos-14) + x86_64 (macos-13)
#
# Triggers: tag v*, workflow_dispatch, packaging PR paths
name: Packages

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    paths:
      - "packaging/**"
      - ".github/workflows/packages.yml"
      - "ratarmount/Cargo.toml"
      - "Cargo.toml"
      - "docs/macos.md"
      - "docs/packaging.md"

permissions:
  contents: write
  id-token: write   # cosign keyless (OIDC)
  attestations: write

env:
  CARGO_TERM_COLOR: always
  NFPM_VERSION: v2.41.3

jobs:
  # =========================================================================
  # Ubuntu / Debian packages (.deb)
  # =========================================================================
  deb:
    name: deb (${{ matrix.label }})
    runs-on: ${{ matrix.runner }}
    # Containers default to `sh`; force bash for all run steps.
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          # Note: Ubuntu 20.04 container builds hang on apt in GHA; use 22.04+ for v0.1.0.
          # Portable bullseye tarball covers older glibc hosts.
          - label: ubuntu-22.04-amd64
            runner: ubuntu-22.04
            distro_label: ubuntu-22.04
          - label: ubuntu-24.04-amd64
            runner: ubuntu-24.04
            distro_label: ubuntu-24.04
          - label: ubuntu-24.04-arm64
            runner: ubuntu-24.04-arm
            distro_label: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config curl ca-certificates git \
            libfuse3-dev fuse3 libarchive-dev zlib1g-dev libssl-dev

      - name: Install Rust
        run: |
          if ! command -v rustc >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - uses: Swatinem/rust-cache@v2
        with:
          key: packages-deb-${{ matrix.label }}


      - name: Build .deb + tarball
        env:
          VERSION: "0.1.1"
          PACKAGE_FAMILY: deb
          DISTRO_LABEL: ${{ matrix.distro_label }}
          OUT_DIR: dist
          OPENSSL_NO_VENDOR: "1"
        run: |
          export PATH="$HOME/.cargo/bin:$HOME/.local/bin:/usr/local/bin:/usr/bin:/bin:$PATH"
          chmod +x packaging/build-native-packages.sh
          bash packaging/build-native-packages.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.label }}
          path: |
            dist/*.deb
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  # =========================================================================
  # Rocky Linux packages (.rpm)
  # =========================================================================
  rpm:
    name: rpm (${{ matrix.label }})
    runs-on: ${{ matrix.runner }}
    # Container jobs default to `sh`; use bash. Keep scripts POSIX-friendly.
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          # Rocky 9 GHA containers still exit 127 during the build step; ship Rocky 8 for v0.1.0.
          # Portable glibc2.31 tarball is the recommended cross-distro binary.
          - label: rocky8-amd64
            runner: ubuntu-latest
            image: rockylinux/rockylinux:8
            distro_label: rocky-8
    container:
      image: ${{ matrix.image }}
    steps:
      # Note: do not install full `coreutils` — Rocky images ship `coreutils-single`
      # and the two conflict without --allowerasing.
      - uses: actions/checkout@v4

      - name: Install build deps (dnf)
        run: |
          # Rocky images ship curl-minimal; installing curl conflicts unless we allow erasing.
          dnf -y install epel-release || true
          dnf -y install 'dnf-command(config-manager)' || true
          dnf config-manager --set-enabled powertools 2>/dev/null \
            || dnf config-manager --set-enabled crb 2>/dev/null \
            || true
          if command -v crb >/dev/null 2>&1; then crb enable || true; fi
          dnf -y install --allowerasing \
            gcc gcc-c++ make pkgconf-pkg-config git ca-certificates \
            which findutils tar gzip \
            fuse3-devel fuse3 libarchive-devel zlib-devel \
            openssl-devel perl-IPC-Cmd
          if ! command -v curl >/dev/null 2>&1; then
            dnf -y install --allowerasing curl
          fi

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          # shellcheck disable=SC1091
          . "$HOME/.cargo/env"
          rustc --version
          cargo --version

      - name: Build .rpm + tarball
        env:
          VERSION: "0.1.1"
          PACKAGE_FAMILY: rpm
          DISTRO_LABEL: ${{ matrix.distro_label }}
          OUT_DIR: dist
          OPENSSL_NO_VENDOR: "1"
        run: |
          # shellcheck disable=SC1091
          [ -f "$HOME/.cargo/env" ] && . "$HOME/.cargo/env"
          export PATH="$HOME/.cargo/bin:$HOME/.local/bin:/usr/local/bin:/usr/bin:/bin:$PATH"
          command -v cargo
          cargo --version
          chmod +x packaging/build-native-packages.sh
          bash packaging/build-native-packages.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rpm-${{ matrix.label }}
          path: |
            dist/*.rpm
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  # =========================================================================
  # Portable tarball on old glibc (Debian bullseye = glibc 2.31)
  # Prefer this binary when you need one artifact for many distros.
  # =========================================================================
  portable:
    name: portable (${{ matrix.label }})
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: bullseye-amd64
            runner: ubuntu-latest
            image: debian:bullseye
            distro_label: portable-glibc2.31
          - label: bullseye-arm64
            runner: ubuntu-24.04-arm
            image: debian:bullseye
            distro_label: portable-glibc2.31
    container:
      image: ${{ matrix.image }}
    steps:
      - name: Bootstrap
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y ca-certificates curl git

      - uses: actions/checkout@v4

      - name: Install build deps
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y \
            build-essential pkg-config curl ca-certificates git \
            libfuse3-dev fuse3 libarchive-dev zlib1g-dev libssl-dev

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"


      - name: Build portable tarball only
        env:
          VERSION: "0.1.1"
          PACKAGE_FAMILY: none
          TARBALL_ONLY: "1"
          DISTRO_LABEL: ${{ matrix.distro_label }}
          OUT_DIR: dist
          OPENSSL_NO_VENDOR: "1"
        run: |
          export PATH="$HOME/.cargo/bin:$HOME/.local/bin:/usr/local/bin:/usr/bin:/bin:$PATH"
          chmod +x packaging/build-native-packages.sh
          bash packaging/build-native-packages.sh
          # Record glibc requirement for consumers
          ldd --version | head -1 | tee dist/glibc-version.txt || true
          file target/release/ratarmount | tee dist/file-info.txt || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: portable-${{ matrix.label }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
            dist/glibc-version.txt
            dist/file-info.txt
          if-no-files-found: error

  # =========================================================================
  # macOS release tarballs (Apple Silicon primary; Intel optional)
  # =========================================================================
  macos:
    name: macos (${{ matrix.label }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macos-arm64
            runner: macos-14
            arch_label: arm64
          # Intel runners are slower/scarcer; keep for release tags when available.
          - label: macos-x86_64
            runner: macos-13
            arch_label: x86_64
    steps:
      - uses: actions/checkout@v4

      - name: Homebrew deps
        # End users: see docs/macos.md. GHA needs macFUSE for *linking* (fuse.pc);
        # kext load is not required to produce the binary.
        run: |
          set -euo pipefail
          brew update
          brew install pkgconf libarchive
          brew install --cask macfuse
          PCS="$(brew --prefix libarchive)/lib/pkgconfig"
          for p in \
            "$(brew --prefix)/lib/pkgconfig" \
            /usr/local/lib/pkgconfig \
            /opt/homebrew/lib/pkgconfig \
            /Library/Filesystems/macfuse.fs/Contents/Resources/pkgconfig; do
            [[ -n "$p" && -d "$p" ]] && PCS="${p}:${PCS}"
          done
          echo "PKG_CONFIG_PATH=${PCS}" >> "$GITHUB_ENV"
          export PKG_CONFIG_PATH="${PCS}"
          pkg-config --exists fuse || pkg-config --exists osxfuse
          pkg-config --modversion fuse 2>/dev/null || pkg-config --modversion osxfuse

      - name: Install Rust
        run: |
          if ! command -v rustc >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - uses: Swatinem/rust-cache@v2
        with:
          key: packages-macos-${{ matrix.label }}

      - name: Build macOS tarball
        env:
          VERSION: "0.1.1"
          OUT_DIR: dist
        run: |
          export PATH="$HOME/.cargo/bin:/opt/homebrew/bin:/usr/local/bin:$PATH"
          export PKG_CONFIG_PATH="$(brew --prefix libarchive)/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          chmod +x packaging/build-macos-tarball.sh
          ./packaging/build-macos-tarball.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.label }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
            dist/file-info-macos-*.txt
          if-no-files-found: error

  # =========================================================================
  # Collect, sign (cosign keyless), release
  # =========================================================================
  release:
    name: Sign & release
    # Collect on tag / manual dispatch even if some matrix legs failed (partial packages).
    if: |
      always() &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (needs.deb.result == 'success' || needs.rpm.result == 'success' || needs.portable.result == 'success' || needs.macos.result == 'success')
    needs: [deb, rpm, portable, macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: false
        continue-on-error: true

      - name: Flatten artifacts
        run: |
          mkdir -p release
          find artifacts -type f \( \
              -name '*.deb' -o -name '*.rpm' -o -name '*.tar.gz' \
              -o -name '*.sha256' -o -name 'glibc-version.txt' -o -name 'file-info*.txt' \
            \) -exec cp -v {} release/ \;
          # Unique names: if collisions, prefix with parent dir
          cd release
          ls -la
          # Combined SHA256SUMS
          : > SHA256SUMS
          for f in *.deb *.rpm *.tar.gz; do
            [[ -f "$f" ]] || continue
            sha256sum "$f" >> SHA256SUMS
          done
          cat SHA256SUMS

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Cosign keyless sign (OIDC)
        # Signs each package blob; verification: cosign verify-blob --certificate-identity-regexp ...
        env:
          COSIGN_EXPERIMENTAL: "1"
          COSIGN_YES: "true"
        run: |
          cd release
          for f in *.deb *.rpm *.tar.gz SHA256SUMS; do
            [[ -f "$f" ]] || continue
            echo "Signing $f"
            cosign sign-blob --yes \
              --bundle "${f}.cosign.bundle" \
              "$f"
          done
          ls -la

      - name: Upload signed bundle (always)
        uses: actions/upload-artifact@v4
        with:
          name: signed-release-bundle
          path: release/

      - name: Create / update GitHub Release (tags only)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ratarmount-rs ${{ github.ref_name }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: false
          generate_release_notes: true
          files: release/**
          body: |
            ## Packages

            | Kind | Platforms |
            |------|-----------|
            | `.deb` | Ubuntu 22.04 / 24.04 (amd64), Ubuntu 24.04 (arm64) |
            | `.rpm` | Rocky 8 (amd64) |
            | Portable tarball | Debian bullseye / glibc 2.31 (amd64 + arm64) |
            | macOS tarball | Apple Silicon (arm64), Intel (x86_64) |

            Cosign keyless signatures (`.cosign.bundle`) and `SHA256SUMS` are included.

            **Linux runtime:** fuse3, libarchive (optional: e2fsprogs, squashfs-tools).  
            **macOS runtime:** macFUSE or FUSE-T, libarchive — see `docs/macos.md`.

            If the Release asset list is empty, download the **signed-release-bundle**
            workflow artifact from the Packages run.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
