# Build distributable packages for Ubuntu (.deb), Rocky (.rpm), portable tarballs,
# macOS tarballs, and cosign keyless signatures for release artifacts.
#
# Matrix:
#   - Ubuntu 22.04, 24.04 — amd64
#   - Ubuntu 24.04 — arm64 (ubuntu-24.04-arm)
#   - Rocky Linux 8 — amd64 (container)
#   - Portable “oldest glibc” tarball — Debian bullseye (glibc 2.31) amd64 + arm64
#   - macOS arm64 (macos-14); x86_64 deferred (GHA macos-13 capacity)
#
# Triggers: tag v*, workflow_dispatch, packaging PR paths
name: Packages

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    paths:
      - "packaging/**"
      - ".github/workflows/packages.yml"
      - "ratarmount/Cargo.toml"
      - "Cargo.toml"
      - "docs/macos.md"
      - "docs/packaging.md"

permissions:
  contents: write
  id-token: write   # cosign keyless (OIDC)
  attestations: write

env:
  CARGO_TERM_COLOR: always
  NFPM_VERSION: v2.41.3

jobs:
  # =========================================================================
  # Ubuntu / Debian packages (.deb)
  # =========================================================================
  deb:
    name: deb (${{ matrix.label }})
    runs-on: ${{ matrix.runner }}
    # Containers default to `sh`; force bash for all run steps.
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          # Note: Ubuntu 20.04 container builds hang on apt in GHA; use 22.04+ for v0.1.0.
          # Portable bullseye tarball covers older glibc hosts.
          - label: ubuntu-22.04-amd64
            runner: ubuntu-22.04
            distro_label: ubuntu-22.04
          - label: ubuntu-24.04-amd64
            runner: ubuntu-24.04
            distro_label: ubuntu-24.04
          - label: ubuntu-24.04-arm64
            runner: ubuntu-24.04-arm
            distro_label: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config curl ca-certificates git \
            libfuse3-dev fuse3 libarchive-dev zlib1g-dev libssl-dev

      - name: Install Rust
        run: |
          if ! command -v rustc >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - uses: Swatinem/rust-cache@v2
        with:
          key: packages-deb-${{ matrix.label }}


      - name: Build .deb + tarball
        env:
          VERSION: "0.1.10"
          PACKAGE_FAMILY: deb
          DISTRO_LABEL: ${{ matrix.distro_label }}
          OUT_DIR: dist
          OPENSSL_NO_VENDOR: "1"
        run: |
          export PATH="$HOME/.cargo/bin:$HOME/.local/bin:/usr/local/bin:/usr/bin:/bin:$PATH"
          chmod +x packaging/build-native-packages.sh
          bash packaging/build-native-packages.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.label }}
          path: |
            dist/*.deb
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  # =========================================================================
  # Rocky Linux packages (.rpm)
  # =========================================================================
  rpm:
    name: rpm (${{ matrix.label }})
    runs-on: ${{ matrix.runner }}
    # Container jobs default to `sh`; use bash. Keep scripts POSIX-friendly.
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          # Rocky 9 GHA containers still exit 127 during the build step; ship Rocky 8 for v0.1.0.
          # Portable glibc2.31 tarball is the recommended cross-distro binary.
          - label: rocky8-amd64
            runner: ubuntu-latest
            image: rockylinux/rockylinux:8
            distro_label: rocky-8
    container:
      image: ${{ matrix.image }}
    steps:
      # Note: do not install full `coreutils` — Rocky images ship `coreutils-single`
      # and the two conflict without --allowerasing.
      - uses: actions/checkout@v4

      - name: Install build deps (dnf)
        run: |
          # Rocky images ship curl-minimal; installing curl conflicts unless we allow erasing.
          dnf -y install epel-release || true
          dnf -y install 'dnf-command(config-manager)' || true
          dnf config-manager --set-enabled powertools 2>/dev/null \
            || dnf config-manager --set-enabled crb 2>/dev/null \
            || true
          if command -v crb >/dev/null 2>&1; then crb enable || true; fi
          dnf -y install --allowerasing \
            gcc gcc-c++ make pkgconf-pkg-config git ca-certificates \
            which findutils tar gzip \
            fuse3-devel fuse3 libarchive-devel zlib-devel \
            openssl-devel perl-IPC-Cmd
          if ! command -v curl >/dev/null 2>&1; then
            dnf -y install --allowerasing curl
          fi

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          # shellcheck disable=SC1091
          . "$HOME/.cargo/env"
          rustc --version
          cargo --version

      - name: Build .rpm + tarball
        env:
          VERSION: "0.1.10"
          PACKAGE_FAMILY: rpm
          DISTRO_LABEL: ${{ matrix.distro_label }}
          OUT_DIR: dist
          OPENSSL_NO_VENDOR: "1"
        run: |
          # shellcheck disable=SC1091
          [ -f "$HOME/.cargo/env" ] && . "$HOME/.cargo/env"
          export PATH="$HOME/.cargo/bin:$HOME/.local/bin:/usr/local/bin:/usr/bin:/bin:$PATH"
          command -v cargo
          cargo --version
          chmod +x packaging/build-native-packages.sh
          bash packaging/build-native-packages.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rpm-${{ matrix.label }}
          path: |
            dist/*.rpm
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  # =========================================================================
  # Portable tarball on old glibc (Debian bullseye = glibc 2.31)
  # Prefer this binary when you need one artifact for many distros.
  # =========================================================================
  portable:
    name: portable (${{ matrix.label }})
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: bullseye-amd64
            runner: ubuntu-latest
            image: debian:bullseye
            distro_label: portable-glibc2.31
          - label: bullseye-arm64
            runner: ubuntu-24.04-arm
            image: debian:bullseye
            distro_label: portable-glibc2.31
    container:
      image: ${{ matrix.image }}
    steps:
      - name: Bootstrap
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y ca-certificates curl git

      - uses: actions/checkout@v4

      - name: Install build deps
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y \
            build-essential pkg-config curl ca-certificates git \
            libfuse3-dev fuse3 libarchive-dev zlib1g-dev libssl-dev

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"


      - name: Build portable tarball only
        env:
          VERSION: "0.1.10"
          PACKAGE_FAMILY: none
          TARBALL_ONLY: "1"
          DISTRO_LABEL: ${{ matrix.distro_label }}
          OUT_DIR: dist
          OPENSSL_NO_VENDOR: "1"
        run: |
          export PATH="$HOME/.cargo/bin:$HOME/.local/bin:/usr/local/bin:/usr/bin:/bin:$PATH"
          chmod +x packaging/build-native-packages.sh
          bash packaging/build-native-packages.sh
          # Record glibc requirement for consumers
          ldd --version | head -1 | tee dist/glibc-version.txt || true
          file target/release/ratarmount | tee dist/file-info.txt || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: portable-${{ matrix.label }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
            dist/glibc-version.txt
            dist/file-info.txt
          if-no-files-found: error

  # =========================================================================
  # macOS release tarballs (Apple Silicon; GHA macos-13 Intel is scarce/deprecated)
  # =========================================================================
  macos:
    name: macos (${{ matrix.label }})
    runs-on: ${{ matrix.runner }}
    env:
      # Avoid inheriting any -Dwarnings that would fail dependency builds.
      RUSTFLAGS: ""
      PKG_CONFIG_PATH: /usr/local/lib/pkgconfig
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macos-arm64
            runner: macos-14
            arch_label: arm64
          # Note: macos-13 (x86_64) removed — jobs sat "queued" indefinitely on GHA
          # and blocked Sign & release. Re-add when GitHub offers reliable Intel runners.
    steps:
      - uses: actions/checkout@v4

      - name: Homebrew deps
        # End users: see docs/macos.md. GHA needs macFUSE for *linking* (fuse.pc);
        # kext load is not required to produce the binary.
        run: |
          set -euo pipefail
          brew update
          brew install pkgconf libarchive
          brew install --cask macfuse
          LA="$(brew --prefix libarchive)/lib/pkgconfig"
          PCS="/usr/local/lib/pkgconfig:${LA}"
          for p in \
            "$(brew --prefix)/lib/pkgconfig" \
            /opt/homebrew/lib/pkgconfig \
            /Library/Filesystems/macfuse.fs/Contents/Resources/pkgconfig; do
            [[ -n "$p" && -d "$p" ]] && PCS="${PCS}:${p}"
          done
          echo "PKG_CONFIG_PATH=${PCS}" >> "$GITHUB_ENV"
          export PKG_CONFIG_PATH="${PCS}"
          if ! pkg-config --exists fuse && ! pkg-config --exists osxfuse; then
            sudo mkdir -p /usr/local/lib/pkgconfig
            for src in /Library/Filesystems/macfuse.fs/Contents/Resources/pkgconfig/*.pc; do
              [[ -f "$src" ]] || continue
              sudo ln -sfn "$src" "/usr/local/lib/pkgconfig/$(basename "$src")"
            done
          fi
          pkg-config --exists fuse || pkg-config --exists osxfuse
          pkg-config --modversion fuse 2>/dev/null || pkg-config --modversion osxfuse

      - name: Install Rust
        run: |
          if ! command -v rustc >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - uses: Swatinem/rust-cache@v2
        with:
          key: packages-macos-${{ matrix.label }}-v2

      - name: Build macOS tarball
        env:
          VERSION: "0.1.10"
          OUT_DIR: dist
          RUSTFLAGS: ""
        run: |
          export PATH="$HOME/.cargo/bin:/opt/homebrew/bin:/usr/local/bin:$PATH"
          export PKG_CONFIG_PATH="${PKG_CONFIG_PATH:-/usr/local/lib/pkgconfig}"
          LA="$(brew --prefix libarchive)/lib/pkgconfig"
          export PKG_CONFIG_PATH="${PKG_CONFIG_PATH}:${LA}"
          chmod +x packaging/build-macos-tarball.sh
          ./packaging/build-macos-tarball.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.label }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
            dist/file-info-macos-*.txt
          if-no-files-found: error

  # =========================================================================
  # Collect, sign (cosign keyless), release
  # =========================================================================
  release:
    name: Sign & release
    # Collect on tag / manual dispatch even if some matrix legs failed (partial packages).
    if: |
      always() &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (needs.deb.result == 'success' || needs.rpm.result == 'success' || needs.portable.result == 'success' || needs.macos.result == 'success')
    needs: [deb, rpm, portable, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: false
        continue-on-error: true

      - name: Flatten artifacts
        run: |
          mkdir -p release
          # Only copy non-empty files (empty release assets are rejected by GitHub).
          find artifacts -type f -size +0c \( \
              -name '*.deb' -o -name '*.rpm' -o -name '*.tar.gz' \
              -o -name '*.sha256' -o -name 'glibc-version.txt' -o -name 'file-info*.txt' \
            \) -exec cp -v {} release/ \;
          cd release
          ls -la
          # Combined SHA256SUMS
          : > SHA256SUMS
          for f in *.deb *.rpm *.tar.gz; do
            [[ -f "$f" ]] || continue
            sha256sum "$f" >> SHA256SUMS
          done
          cat SHA256SUMS

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Cosign keyless sign (OIDC)
        # Signs each package blob; verification: cosign verify-blob --certificate-identity-regexp ...
        env:
          COSIGN_EXPERIMENTAL: "1"
          COSIGN_YES: "true"
        run: |
          cd release
          for f in *.deb *.rpm *.tar.gz SHA256SUMS; do
            [[ -f "$f" ]] || continue
            echo "Signing $f"
            cosign sign-blob --yes \
              --bundle "${f}.cosign.bundle" \
              "$f"
          done
          ls -la

      - name: Upload signed bundle (always)
        uses: actions/upload-artifact@v4
        with:
          name: signed-release-bundle
          path: release/

      - name: Create / update GitHub Release (tags only)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -uo pipefail
          # Pure REST (curl+jq) so we never depend on gh CLI, and every failure
          # is emitted as a workflow annotation (visible without job-log auth).
          DEBUG_LOG="${RUNNER_TEMP}/release-debug.log"
          exec > >(tee -a "$DEBUG_LOG") 2>&1
          fail() {
            echo "::error::$1"
            echo "ERROR: $1"
            if [[ -f "$DEBUG_LOG" ]]; then
              echo "::group::release-debug.log"
              cat "$DEBUG_LOG"
              echo "::endgroup::"
            fi
            exit 1
          }
          note() { echo "::notice::$1"; echo "$1"; }

          command -v curl >/dev/null || fail "curl missing"
          command -v jq >/dev/null || fail "jq missing"
          [[ -n "${GITHUB_TOKEN:-}" ]] || fail "GITHUB_TOKEN empty"
          [[ -n "${GITHUB_REPOSITORY:-}" ]] || fail "GITHUB_REPOSITORY empty"
          [[ -n "${TAG:-}" ]] || fail "TAG empty"
          [[ -d release ]] || fail "release/ directory missing"

          API="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          AUTH=( -H "Authorization: Bearer ${GITHUB_TOKEN}"
                 -H "Accept: application/vnd.github+json"
                 -H "X-GitHub-Api-Version: 2022-11-28" )

          # Probe token: dump accepted scopes / rate limit headers.
          note "Probing token against ${API}"
          probe_headers="$(mktemp)"
          probe_body="$(mktemp)"
          probe_code=$(curl -sS -D "$probe_headers" -o "$probe_body" -w "%{http_code}" \
            "${AUTH[@]}" "$API" || true)
          echo "probe HTTP $probe_code"
          grep -iE '^(x-oauth-scopes|x-accepted-oauth-scopes|x-github-request-id|x-ratelimit|HTTP/)' "$probe_headers" || true
          echo "repo permissions from API:" 
          jq '{permissions, has_downloads, visibility, default_branch}' "$probe_body" 2>/dev/null || cat "$probe_body"
          if [[ "$probe_code" != "200" ]]; then
            fail "Token cannot read repo (HTTP $probe_code)"
          fi

          cd release
          ls -la
          # GitHub Releases reject empty blobs (HTTP 422). Skip 0-byte sidecars
          # like a failed `file ... | tee file-info.txt` from a matrix leg.
          mapfile -t files < <(
            find . -maxdepth 1 -type f ! -name '.*' -size +0c -printf '%f\n' | sort
          )
          mapfile -t empty_files < <(
            find . -maxdepth 1 -type f ! -name '.*' -size 0c -printf '%f\n' | sort || true
          )
          if [[ ${#empty_files[@]} -gt 0 ]]; then
            note "Skipping empty files (not uploadable): ${empty_files[*]}"
          fi
          note "Asset count: ${#files[@]}"
          printf '  %s\n' "${files[@]}"
          [[ ${#files[@]} -gt 0 ]] || fail "No non-empty files under release/"

          NOTES_FILE="$(mktemp)"
          cat >"$NOTES_FILE" <<'MD'
          ## Packages

          | Kind | Platforms |
          |------|-----------|
          | `.deb` | Ubuntu 22.04 / 24.04 (amd64), Ubuntu 24.04 (arm64) |
          | `.rpm` | Rocky 8 (amd64) |
          | Portable tarball | Debian bullseye / glibc 2.31 (amd64 + arm64) |
          | macOS tarball | Apple Silicon (arm64) |

          Cosign keyless signatures (`.cosign.bundle`) and `SHA256SUMS` are included.

          **Linux runtime:** fuse3, libarchive (optional: e2fsprogs, squashfs-tools).
          **macOS runtime:** macFUSE or FUSE-T, libarchive — see `docs/macos.md`.

          Workflow artifact fallback: **signed-release-bundle** on the Packages run.
          MD
          sed -i 's/^          //' "$NOTES_FILE"

          # Build JSON body with jq so notes are safely escaped.
          create_payload="$(mktemp)"
          jq -n \
            --arg tag "$TAG" \
            --arg name "ratarmount-rs $TAG" \
            --rawfile body "$NOTES_FILE" \
            '{tag_name:$tag, name:$name, body:$body, draft:false, prerelease:false, make_latest:"true", generate_release_notes:false}' \
            >"$create_payload"

          # GET existing release by tag (404 = create).
          existing_body="$(mktemp)"
          existing_code=$(curl -sS -o "$existing_body" -w "%{http_code}" \
            "${AUTH[@]}" "${API}/releases/tags/${TAG}" || true)
          echo "GET releases/tags/${TAG} -> HTTP $existing_code"
          if [[ "$existing_code" == "200" ]]; then
            RELEASE_ID=$(jq -r '.id' "$existing_body")
            UPLOAD_URL=$(jq -r '.upload_url' "$existing_body" | sed 's/{?name,label}//')
            note "Updating existing release id=$RELEASE_ID"
            edit_code=$(curl -sS -o /tmp/edit-resp.json -w "%{http_code}" \
              -X PATCH "${AUTH[@]}" \
              -H "Content-Type: application/json" \
              "${API}/releases/${RELEASE_ID}" \
              -d @"$create_payload" || true)
            echo "PATCH release -> HTTP $edit_code"
            cat /tmp/edit-resp.json
            [[ "$edit_code" == "200" ]] || fail "PATCH release failed HTTP $edit_code: $(cat /tmp/edit-resp.json)"
          else
            note "Creating release for tag $TAG"
            create_headers="$(mktemp)"
            create_body="$(mktemp)"
            create_code=$(curl -sS -D "$create_headers" -o "$create_body" -w "%{http_code}" \
              -X POST "${AUTH[@]}" \
              -H "Content-Type: application/json" \
              "${API}/releases" \
              -d @"$create_payload" || true)
            echo "POST /releases -> HTTP $create_code"
            grep -iE '^(x-oauth-scopes|x-accepted-oauth-scopes|x-github-request-id|HTTP/)' "$create_headers" || true
            cat "$create_body"
            if [[ "$create_code" != "201" ]]; then
              fail "POST /releases failed HTTP $create_code: $(cat "$create_body")"
            fi
            RELEASE_ID=$(jq -r '.id' "$create_body")
            UPLOAD_URL=$(jq -r '.upload_url' "$create_body" | sed 's/{?name,label}//')
            note "Created release id=$RELEASE_ID"
          fi

          [[ -n "$RELEASE_ID" && "$RELEASE_ID" != "null" ]] || fail "No release id"
          [[ -n "$UPLOAD_URL" && "$UPLOAD_URL" != "null" ]] || fail "No upload_url"

          for f in "${files[@]}"; do
            size=$(stat -c%s "$f")
            note "Uploading $f ($size bytes)"
            # Delete existing asset with same name (clobber).
            assets_json=$(curl -sS "${AUTH[@]}" "${API}/releases/${RELEASE_ID}/assets?per_page=100")
            old_id=$(echo "$assets_json" | jq -r --arg n "$f" '.[] | select(.name==$n) | .id' | head -1)
            if [[ -n "${old_id:-}" && "$old_id" != "null" ]]; then
              echo "Deleting existing asset id=$old_id name=$f"
              curl -sS -X DELETE "${AUTH[@]}" "${API}/releases/assets/${old_id}" >/dev/null || true
            fi
            # Content-Type: application/octet-stream for all package blobs.
            up_body="$(mktemp)"
            up_code=$(curl -sS -o "$up_body" -w "%{http_code}" \
              -X POST "${AUTH[@]}" \
              -H "Content-Type: application/octet-stream" \
              --data-binary @"$f" \
              "${UPLOAD_URL}?name=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))" "$f")" \
              || true)
            echo "upload $f -> HTTP $up_code"
            if [[ "$up_code" != "201" ]]; then
              cat "$up_body"
              fail "Upload $f failed HTTP $up_code: $(head -c 500 "$up_body")"
            fi
          done

          final=$(curl -sS "${AUTH[@]}" "${API}/releases/${RELEASE_ID}")
          count=$(echo "$final" | jq '.assets | length')
          url=$(echo "$final" | jq -r '.html_url')
          note "Release published: $url ($count assets)"
          echo "$final" | jq '{tag_name, html_url, assets: [.assets[].name]}'
