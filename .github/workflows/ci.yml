name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  check:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse3-dev fuse3 pkg-config libarchive-dev zlib1g-dev

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

  fuse-harness:
    name: FUSE phase allowlists
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - name: Checkout Python ratarmount (fixtures)
        # hilather fork includes extra 7z fixtures used by phase9-sevenzip.
        uses: actions/checkout@v4
        with:
          repository: hilather/ratarmount
          path: ratarmount-py

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse3-dev fuse3 pkg-config libarchive-dev \
            zlib1g-dev squashfs-tools tar

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release

      - name: Phase allowlist suite
        env:
          RATARMOUNT_PY_ROOT: ${{ github.workspace }}/ratarmount-py
          RATARMOUNT_CMD: ${{ github.workspace }}/target/release/ratarmount
        run: |
          # Core formats only (fast, no network secrets)
          ./test-harness/run-phase2-allowlist.sh
          ./test-harness/run-phase3-gzip.sh
          ./test-harness/run-phase4-bzip2.sh
          ./test-harness/run-phase5-xz-zstd.sh
          ./test-harness/run-phase6-zip.sh
          ./test-harness/run-phase7-nested.sh
          ./test-harness/run-phase8-complex-usage.sh
          ./test-harness/run-phase9-ar-cpio.sh
          ./test-harness/run-phase9-sevenzip.sh

  # -------------------------------------------------------------------------
  # macOS: compile + unit tests (FUSE mount is best-effort; GHA cannot load
  # macFUSE kexts).
  # Mirrors fuser upstream mac-ci: macfuse cask + /usr/local/lib/pkgconfig.
  # -------------------------------------------------------------------------
  macos:
    name: macOS (build + test)
    runs-on: macos-14
    env:
      # Workflow-level RUSTFLAGS=-Dwarnings also applies to *dependencies*.
      # On macOS that can fail the fuser/macFUSE build with exit 101. Clippy
      # still enforces -D warnings on our workspace crates below.
      RUSTFLAGS: ""
      # macFUSE installs fuse.pc under /usr/local even on Apple Silicon.
      PKG_CONFIG_PATH: /usr/local/lib/pkgconfig
    steps:
      - uses: actions/checkout@v4

      - name: Homebrew deps
        # fuser on Darwin requires pkg-config package "fuse" or "osxfuse"
        # (macFUSE). FUSE-T alone is not enough to *link*.
        run: |
          set -euo pipefail
          brew update
          brew install pkgconf libarchive
          brew install --cask macfuse

          # Optional runtime for smoke mounts (best-effort).
          brew install --cask fuse-t || true

          LA="$(brew --prefix libarchive)/lib/pkgconfig"
          PCS="/usr/local/lib/pkgconfig"
          for p in \
            "$LA" \
            "$(brew --prefix)/lib/pkgconfig" \
            /opt/homebrew/lib/pkgconfig \
            /Library/Filesystems/macfuse.fs/Contents/Resources/pkgconfig; do
            [[ -n "$p" && -d "$p" ]] && PCS="${PCS}:${p}"
          done
          echo "PKG_CONFIG_PATH=${PCS}" >> "$GITHUB_ENV"
          export PKG_CONFIG_PATH="${PCS}"

          # Ensure pkg-config can see fuse (macFUSE may drop files under
          # /Library/Filesystems/...; symlink into /usr/local if needed).
          if ! pkg-config --exists fuse && ! pkg-config --exists osxfuse; then
            sudo mkdir -p /usr/local/lib/pkgconfig
            for src in \
              /Library/Filesystems/macfuse.fs/Contents/Resources/pkgconfig/*.pc \
              /usr/local/opt/macfuse/lib/pkgconfig/*.pc; do
              [[ -f "$src" ]] || continue
              sudo ln -sfn "$src" "/usr/local/lib/pkgconfig/$(basename "$src")"
            done
          fi

          echo "==> fuse pkg-config probe"
          echo "PKG_CONFIG_PATH=$PKG_CONFIG_PATH"
          pkg-config --list-all | grep -iE 'fuse|osx' || true
          ls -la /usr/local/lib/pkgconfig 2>/dev/null || true
          ls -la /Library/Filesystems/macfuse.fs/Contents/Resources/pkgconfig 2>/dev/null || true
          if ! pkg-config --exists fuse && ! pkg-config --exists osxfuse; then
            echo "ERROR: no fuse/osxfuse .pc after macFUSE install"
            exit 1
          fi
          pkg-config --modversion fuse 2>/dev/null || pkg-config --modversion osxfuse
          pkg-config --libs fuse 2>/dev/null || pkg-config --libs osxfuse
          pkg-config --cflags fuse 2>/dev/null || pkg-config --cflags osxfuse

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-14-v2

      - name: cargo build (fuse smoke compile)
        # Surface link/build errors before clippy. Emit ::error:: annotations so
        # failure details are visible via the public Checks API without log auth.
        run: |
          set +e
          cargo build -p ratarmount-fuse -p ratarmount --all-targets 2>&1 | tee /tmp/cargo-macos-build.log
          code=${PIPESTATUS[0]}
          if [[ "$code" -ne 0 ]]; then
            echo "::group::cargo build failure (tail)"
            tail -n 120 /tmp/cargo-macos-build.log
            echo "::endgroup::"
            # Annotations (public on public repos)
            grep -E 'error(\[E[0-9]+\]|:)|\berror: ' /tmp/cargo-macos-build.log \
              | head -n 40 \
              | while IFS= read -r line; do
                  # Truncate extremely long lines for annotation limits
                  echo "::error::${line:0:300}"
                done
            grep -E 'note:|warning:|ld:|Undefined|pkg-config|fuse' /tmp/cargo-macos-build.log \
              | head -n 30 \
              | while IFS= read -r line; do
                  echo "::warning::${line:0:300}"
                done
            exit "$code"
          fi

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

      - name: Build release
        run: cargo build --release -p ratarmount

      - name: FUSE smoke (best-effort)
        continue-on-error: true
        env:
          RATARMOUNT_CMD: ${{ github.workspace }}/target/release/ratarmount
          SKIP_IF_NO_FUSE: "1"
        run: |
          chmod +x test-harness/run-macos-smoke.sh
          ./test-harness/run-macos-smoke.sh
