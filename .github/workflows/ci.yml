name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  check:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get update -o Acquire::Retries=5
          sudo apt-get install -y -o Acquire::Retries=5 \
            libfuse3-dev fuse3 pkg-config libarchive-dev zlib1g-dev

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

      - name: packaging systemd/autofs helper
        run: |
          chmod +x packaging/test-systemd-unit.sh
          ./packaging/test-systemd-unit.sh

  # Optional feature: NFSv4.1 (embednfs, rustc ≥ 1.88). Default check job
  # stays on workspace MSRV 1.74 and does not compile embednfs. After the
  # RO adapter landed, this job is required so packaging --features nfsv4
  # cannot go stale. Soft-skip is not allowed for the unit tests.
  nfsv4:
    name: nfsv4 feature tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get update -o Acquire::Retries=5
          sudo apt-get install -y -o Acquire::Retries=5 \
            libfuse3-dev fuse3 pkg-config libarchive-dev zlib1g-dev

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: nfsv4

      - name: cargo clippy (nfsv4)
        run: cargo clippy -p ratarmount-nfs --all-targets --features nfsv4 -- -D warnings

      - name: cargo test (nfsv4)
        run: |
          cargo test -p ratarmount-nfs --features nfsv4 --lib v4_
          cargo test -p ratarmount-nfs --features nfsv4 --lib v4_overlay
          cargo test -p ratarmount-nfs --features nfsv4 --lib evict_idle
          cargo test -p ratarmount-nfs --features nfsv4 --lib v4_exchange_id
          cargo test -p ratarmount --features nfsv4 --bin ratarmount nfs_vers

      - name: packaging compile-line check
        run: |
          chmod +x packaging/test-nfsv4-features.sh
          ./packaging/test-nfsv4-features.sh

  # Pure-Rust cold-index microbench from benchmarks/baselines/rust-gates.json.
  # No /dev/fuse and no Python required at runtime (--no-mount only).
  benchmark-gates:
    name: benchmark gates (cold index)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get update -o Acquire::Retries=5
          sudo apt-get install -y -o Acquire::Retries=5 \
            libfuse3-dev fuse3 pkg-config libarchive-dev zlib1g-dev

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: bench-gates

      - name: Build release binary
        run: cargo build --release -p ratarmount

      - name: Enforce rust-gates.json (cold index hard gate)
        env:
          RUST_BIN: ${{ github.workspace }}/target/release/ratarmount
          SKIP_BUILD: "1"
        run: |
          chmod +x benchmarks/check-rust-gates.sh
          ./benchmarks/check-rust-gates.sh

  # Optional full vs-Python ratio gates from rust-gates.json.
  # Uses committed RESULTS_CSV when present; ALLOW_RATIO_SKIP=1 so missing
  # Python/FUSE/CSV never reds the tree. Cold index still hard-fails.
  # Also runnable via workflow_dispatch for ad-hoc full checks.
  benchmark-gates-full:
    name: benchmark gates (full ratios, soft-skip)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Always on PR/push like the cold job, but soft on ratio availability.
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get update -o Acquire::Retries=5
          sudo apt-get install -y -o Acquire::Retries=5 \
            libfuse3-dev fuse3 pkg-config libarchive-dev zlib1g-dev

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: bench-gates

      - name: Build release binary
        run: cargo build --release -p ratarmount

      - name: Enforce rust-gates.json (full ratios; ALLOW_RATIO_SKIP)
        env:
          RUST_BIN: ${{ github.workspace }}/target/release/ratarmount
          SKIP_BUILD: "1"
          RUN_FULL_BENCH: "1"
          ALLOW_RATIO_SKIP: "1"
        run: |
          chmod +x benchmarks/check-rust-gates.sh benchmarks/compare-python-vs-rust.sh
          ./benchmarks/check-rust-gates.sh

  fuse-harness:
    name: FUSE phase allowlists
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Checkout Python ratarmount (fixtures)
        # hilather fork includes extra 7z fixtures used by phase9-sevenzip.
        uses: actions/checkout@v4
        with:
          repository: hilather/ratarmount
          path: ratarmount-py

      - name: Install deps
        run: |
          sudo apt-get update -o Acquire::Retries=5
          sudo apt-get install -y -o Acquire::Retries=5 \
            libfuse3-dev fuse3 pkg-config libarchive-dev \
            zlib1g-dev squashfs-tools tar

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release

      - name: Phase allowlist suite
        env:
          RATARMOUNT_PY_ROOT: ${{ github.workspace }}/ratarmount-py
          RATARMOUNT_CMD: ${{ github.workspace }}/target/release/ratarmount
        run: |
          # Core formats only (fast, no network secrets)
          ./test-harness/run-phase2-allowlist.sh
          ./test-harness/run-phase3-gzip.sh
          ./test-harness/run-phase4-bzip2.sh
          ./test-harness/run-phase5-xz-zstd.sh
          ./test-harness/run-phase6-zip.sh
          ./test-harness/run-phase7-nested.sh
          ./test-harness/run-phase8-complex-usage.sh
          ./test-harness/run-phase9-ar-cpio.sh
          ./test-harness/run-phase9-sevenzip.sh

  # -------------------------------------------------------------------------
  # macOS: compile + unit tests (FUSE mount is best-effort; GHA cannot load
  # macFUSE kexts).
  # Mirrors fuser upstream mac-ci: macfuse cask + /usr/local/lib/pkgconfig.
  # -------------------------------------------------------------------------
  macos:
    name: macOS (build + test)
    runs-on: macos-14
    timeout-minutes: 60
    env:
      # Workflow-level RUSTFLAGS=-Dwarnings also applies to *dependencies*.
      # On macOS that can fail the fuser/macFUSE build with exit 101. Clippy
      # still enforces -D warnings on our workspace crates below.
      RUSTFLAGS: ""
      # macFUSE installs fuse.pc under /usr/local even on Apple Silicon.
      PKG_CONFIG_PATH: /usr/local/lib/pkgconfig
      # Faster / less flaky Homebrew on GHA runners.
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Homebrew deps
        # fuser on Darwin requires pkg-config package "fuse" or "osxfuse"
        # (macFUSE). FUSE-T alone is not enough to *link*.
        run: |
          set -euo pipefail
          # Avoid full `brew update` (slow + flaky on GHA). Only refresh if formulas missing.
          need_update=0
          for f in pkgconf libarchive gnu-tar zstd bzip2 p7zip; do
            brew list --versions "$f" >/dev/null 2>&1 || need_update=1
          done
          if [[ "$need_update" -eq 1 ]]; then
            brew update || echo "::warning::brew update failed; continuing with current bottles"
          fi
          # Core link deps + CLIs used by unit tests (zstd/bzip2/p7zip/gzip).
          # Without zstd/bzip2, factory side-table tests used to panic on spawn.
          brew install pkgconf libarchive gnu-tar zstd bzip2 p7zip
          brew install --cask macfuse

          # Optional runtime for smoke mounts (best-effort).
          brew install --cask fuse-t || true
          # Prefer GNU tar (Homebrew gtar) for --commit-overlay tests.
          echo "$(brew --prefix gnu-tar)/libexec/gnubin" >> "$GITHUB_PATH"
          # Ensure Homebrew zstd/bzip2/7z are on PATH (Apple Silicon prefixes).
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix zstd)/bin" >> "$GITHUB_PATH" || true
          echo "$(brew --prefix bzip2)/bin" >> "$GITHUB_PATH" || true

          LA="$(brew --prefix libarchive)/lib/pkgconfig"
          PCS="/usr/local/lib/pkgconfig"
          for p in \
            "$LA" \
            "$(brew --prefix)/lib/pkgconfig" \
            /opt/homebrew/lib/pkgconfig \
            /Library/Filesystems/macfuse.fs/Contents/Resources/pkgconfig; do
            [[ -n "$p" && -d "$p" ]] && PCS="${PCS}:${p}"
          done
          echo "PKG_CONFIG_PATH=${PCS}" >> "$GITHUB_ENV"
          export PKG_CONFIG_PATH="${PCS}"

          # Ensure pkg-config can see fuse (macFUSE may drop files under
          # /Library/Filesystems/...; symlink into /usr/local if needed).
          if ! pkg-config --exists fuse && ! pkg-config --exists osxfuse; then
            sudo mkdir -p /usr/local/lib/pkgconfig
            for src in \
              /Library/Filesystems/macfuse.fs/Contents/Resources/pkgconfig/*.pc \
              /usr/local/opt/macfuse/lib/pkgconfig/*.pc; do
              [[ -f "$src" ]] || continue
              sudo ln -sfn "$src" "/usr/local/lib/pkgconfig/$(basename "$src")"
            done
          fi

          echo "==> fuse pkg-config probe"
          echo "PKG_CONFIG_PATH=$PKG_CONFIG_PATH"
          pkg-config --list-all | grep -iE 'fuse|osx' || true
          ls -la /usr/local/lib/pkgconfig 2>/dev/null || true
          ls -la /Library/Filesystems/macfuse.fs/Contents/Resources/pkgconfig 2>/dev/null || true
          if ! pkg-config --exists fuse && ! pkg-config --exists osxfuse; then
            echo "ERROR: no fuse/osxfuse .pc after macFUSE install"
            exit 1
          fi
          pkg-config --modversion fuse 2>/dev/null || pkg-config --modversion osxfuse
          pkg-config --libs fuse 2>/dev/null || pkg-config --libs osxfuse
          pkg-config --cflags fuse 2>/dev/null || pkg-config --cflags osxfuse

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          # Bump when macOS toolchain / macFUSE link env changes.
          key: macos-14-v3

      - name: cargo build (fuse smoke compile)
        # Surface link/build errors before clippy. Emit ::error:: annotations so
        # failure details are visible via the public Checks API without log auth.
        run: |
          set +e
          cargo build -p ratarmount-fuse -p ratarmount --all-targets 2>&1 | tee /tmp/cargo-macos-build.log
          code=${PIPESTATUS[0]}
          if [[ "$code" -ne 0 ]]; then
            echo "::group::cargo build failure (tail)"
            tail -n 120 /tmp/cargo-macos-build.log
            echo "::endgroup::"
            # Annotations (public on public repos)
            grep -E 'error(\[E[0-9]+\]|:)|\berror: ' /tmp/cargo-macos-build.log \
              | head -n 40 \
              | while IFS= read -r line; do
                  # Truncate extremely long lines for annotation limits
                  echo "::error::${line:0:300}"
                done
            grep -E 'note:|warning:|ld:|Undefined|pkg-config|fuse' /tmp/cargo-macos-build.log \
              | head -n 30 \
              | while IFS= read -r line; do
                  echo "::warning::${line:0:300}"
                done
            exit "$code"
          fi

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        # Single-threaded default avoids SQLite side-table races under load; workers
        # still parallelize within crates when safe. --no-fail-fast surfaces all fails.
        run: |
          set +e
          cargo test --workspace --no-fail-fast -- --test-threads=2 2>&1 | tee /tmp/cargo-macos-test.log
          code=${PIPESTATUS[0]}
          if [[ "$code" -ne 0 ]]; then
            echo "::group::cargo test failure (tail)"
            tail -n 200 /tmp/cargo-macos-test.log
            echo "::endgroup::"
            # Prefer real failure lines. Do NOT annotate every "test result: ok"
            # (that flooded the Checks API and hid the actual FAILED tests).
            {
              grep -E 'FAILED|failures:|error\[E[0-9]+\]|panicked at|assertion failed|thread .+ panicked|database is locked' /tmp/cargo-macos-test.log || true
              grep -E 'test result: FAILED' /tmp/cargo-macos-test.log || true
              # Package-level summary lines that indicate failure
              grep -E 'error: test failed|error: could not compile' /tmp/cargo-macos-test.log || true
            } | head -n 40 | while IFS= read -r line; do
              echo "::error::${line:0:350}"
            done
            # Also print a compact failures section to the job log
            echo "::group::extracted failures"
            grep -nE 'FAILED|failures:|panicked at|error\[E|test result: FAILED|could not compile|database is locked' /tmp/cargo-macos-test.log | head -n 80 || true
            echo "::endgroup::"
            exit "$code"
          fi

      - name: Build release
        run: cargo build --release -p ratarmount

      - name: FUSE smoke (best-effort)
        continue-on-error: true
        env:
          RATARMOUNT_CMD: ${{ github.workspace }}/target/release/ratarmount
          SKIP_IF_NO_FUSE: "1"
        run: |
          chmod +x test-harness/run-macos-smoke.sh
          ./test-harness/run-macos-smoke.sh

  # G6.1: Windows library compile without FUSE / WinFsp. Not a merge gate.
  # Must not be `needs:` of `check` or `fuse-harness` (those stay Linux-only).
  # Default session still links libarchive until G5.3 — skip that step when
  # pkg-config `archive` is missing.
  windows-lib:
    name: windows-lib (session check, best-effort)
    runs-on: windows-2022
    continue-on-error: true
    timeout-minutes: 45
    env:
      RUSTFLAGS: "-Dwarnings"
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-lib

      - name: cargo check core + index
        run: cargo check -p ratarmount-core -p ratarmount-index --all-targets

      - name: cargo check session
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v pkg-config >/dev/null 2>&1 \
            || { ! pkg-config --exists libarchive && ! pkg-config --exists archive; }; then
            echo "::notice::skip: pkg-config archive missing (G6.1 best-effort until G5.3)"
            exit 0
          fi
          cargo check -p ratarmount-session --all-targets
