[package]
name = "ratarmount"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Random Access To Archived Resources (Rust)"
default-run = "ratarmount"

[[bin]]
name = "ratarmount"
path = "src/main.rs"

[features]
default = []
# Path-backed rapidgzip gzip backend (requires rustc ≥ 1.87). See docs/gzip-binding-decision.md.
gzip-rapidgzip = ["ratarmount-compress/gzip-rapidgzip"]
# rapidgzip + ISA-L sequential inflate (needs system/prefix libisal).
# Enables this crate's `gzip-rapidgzip` cfg (factory/tests) plus compress ISA-L.
gzip-rapidgzip-isal = ["gzip-rapidgzip", "ratarmount-compress/gzip-rapidgzip-isal"]

[dependencies]
ratarmount-core.workspace = true
ratarmount-index.workspace = true
ratarmount-formats-tar.workspace = true
ratarmount-formats-zip.workspace = true
ratarmount-formats-ar.workspace = true
ratarmount-formats-cpio.workspace = true
ratarmount-formats-iso9660.workspace = true
ratarmount-formats-warc.workspace = true
ratarmount-formats-xar.workspace = true
ratarmount-formats-cab.workspace = true
ratarmount-formats-libarchive.workspace = true
ratarmount-formats-sevenzip.workspace = true
ratarmount-formats-sqlar.workspace = true
ratarmount-formats-squashfs.workspace = true
ratarmount-formats-ext4.workspace = true
ratarmount-formats-fat.workspace = true
ratarmount-formats-asar.workspace = true
ratarmount-formats-ogg.workspace = true
ratarmount-formats-html.workspace = true
ratarmount-formats-pdf.workspace = true
ratarmount-formats-git.workspace = true
ratarmount-remote.workspace = true
ratarmount-compositing.workspace = true
ratarmount-fuse.workspace = true
ratarmount-compress.workspace = true
tempfile.workspace = true
clap.workspace = true
env_logger.workspace = true
log.workspace = true
url = "2"
nix = { version = "0.29", features = ["process"] }
libc.workspace = true
