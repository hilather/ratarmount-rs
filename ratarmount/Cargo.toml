[package]
name = "ratarmount"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Random Access To Archived Resources (Rust)"
default-run = "ratarmount"

[[bin]]
name = "ratarmount"
path = "src/main.rs"

[features]
default = []
# Path-backed rapidgzip gzip backend (requires rustc ≥ 1.87). See docs/gzip-binding-decision.md.
# Forward onto the session crate so factory `#[cfg(feature = "gzip-rapidgzip")]` compiles in.
gzip-rapidgzip = [
    "ratarmount-session/gzip-rapidgzip",
    "ratarmount-compress/gzip-rapidgzip",
]
# rapidgzip + ISA-L sequential inflate (needs system/prefix libisal).
# Enables this crate's `gzip-rapidgzip` cfg plus compress/session ISA-L.
gzip-rapidgzip-isal = [
    "gzip-rapidgzip",
    "ratarmount-session/gzip-rapidgzip-isal",
    "ratarmount-compress/gzip-rapidgzip-isal",
]
# NFSv4.1 via embednfs (requires rustc ≥ 1.88 / edition 2024). See docs/nfs-export.md.
nfsv4 = ["ratarmount-nfs/nfsv4"]
# SFTP export via russh (requires rustc ≥ 1.85). Default CI stays 1.74.
sftp-russh = ["ratarmount-sftp/sftp-russh"]

[dependencies]
ratarmount-core.workspace = true
ratarmount-index.workspace = true
# CLI always wants the full factory matrix. Session default is formats-all
# today; pin the feature so a later slim-default shrink does not drop L2 here.
ratarmount-session = { workspace = true, features = ["formats-all"] }
ratarmount-formats-tar.workspace = true
ratarmount-formats-zip.workspace = true
ratarmount-formats-ar.workspace = true
ratarmount-formats-cpio.workspace = true
ratarmount-formats-iso9660.workspace = true
ratarmount-formats-warc.workspace = true
ratarmount-formats-xar.workspace = true
ratarmount-formats-cab.workspace = true
ratarmount-formats-libarchive.workspace = true
ratarmount-formats-sevenzip.workspace = true
ratarmount-formats-sqlar.workspace = true
ratarmount-formats-squashfs.workspace = true
ratarmount-formats-ext4.workspace = true
ratarmount-formats-fat.workspace = true
ratarmount-formats-asar.workspace = true
ratarmount-formats-ogg.workspace = true
ratarmount-formats-html.workspace = true
ratarmount-formats-pdf.workspace = true
ratarmount-formats-git.workspace = true
ratarmount-remote.workspace = true
ratarmount-compositing.workspace = true
ratarmount-fuse.workspace = true
ratarmount-nfs.workspace = true
ratarmount-http.workspace = true
ratarmount-smb.workspace = true
ratarmount-9p.workspace = true
ratarmount-sftp.workspace = true
ratarmount-compress.workspace = true
tempfile.workspace = true
clap.workspace = true
env_logger.workspace = true
log.workspace = true
url = "2"
nix = { version = "0.29", features = ["process", "signal"] }
libc.workspace = true

[dev-dependencies]
tempfile.workspace = true
nix = { version = "0.29", features = ["signal"] }
ratarmount-compress.workspace = true
ratarmount-formats-tar.workspace = true
