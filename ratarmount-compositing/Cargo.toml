[package]
name = "ratarmount-compositing"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Compositing MountSources: union, automount, folder"

[features]
# Test seams for CLI tests (host_stat panic injection). Enabled only through
# the `ratarmount` dev-dependency, never in a normal build.
test-hooks = ["ratarmount-compress/test-hooks"]

[dependencies]
ratarmount-core.workspace = true
ratarmount-compress.workspace = true
# Live last-frame .tar.zst persist (ustar rewrite + last-EOF)
ratarmount-formats-tar.workspace = true
# Incremental sidecar patch after persist (F-2); never create_writable
ratarmount-index.workspace = true
libc.workspace = true
log.workspace = true
thiserror.workspace = true
tempfile.workspace = true
rusqlite.workspace = true
regex = "1"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
sha2 = "0.10"
blake3 = "=1.8.2"
base64 = "0.22"
# Recompress after commit_overlay on .tar.gz / .tar.bz2 / .tar.xz
flate2 = "1"
bzip2 = { version = "0.5", features = ["static"] }
xz2 = { version = "0.1", features = ["static"] }
# Full rebuild of .zip on --commit-overlay (store/deflate; not in-place)
zip = { version = "2", default-features = true }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", features = ["fs"] }

[dev-dependencies]
ratarmount-compress = { workspace = true, features = ["test-hooks"] }
ratarmount-formats-sevenzip.workspace = true
ratarmount-formats-zip.workspace = true
tempfile.workspace = true
