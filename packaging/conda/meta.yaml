{% set version = "0.1.34" %}

package:
  name: ratarmount-rs
  version: {{ version }}

source:
  url: https://github.com/hilather/ratarmount-rs/archive/refs/tags/v{{ version }}.tar.gz

build:
  number: 0
  script: {{ PYTHON }} -m pip install ./ratarmount-python --no-deps --no-build-isolation -vv
  skip: true  # [win]

requirements:
  build:
    - {{ compiler('rust') }}
    - {{ compiler('c') }}
  host:
    - python
    - pip
    - maturin >=1.9,<2
    - libarchive
    - pkg-config
    - openssl
    - zlib
  run:
    - python >=3.9
    - fuse3  # [linux]

test:
  imports:
    - ratarmount_rs

about:
  home: https://github.com/hilather/ratarmount-rs
  license: MIT
  license_file: LICENSE
  summary: Python archive access and archive mounting with random access

extra:
  recipe-maintainers:
    - hilather
