# Static provisioning only; there is no external provisioner/controller.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: ratarmount-ro
provisioner: kubernetes.io/no-provisioner
reclaimPolicy: Retain
volumeBindingMode: Immediate
allowVolumeExpansion: false
---
apiVersion: storage.k8s.io/v1
kind: CSIDriver
metadata:
  name: ratarmount.csi.hilather.github.io
spec:
  attachRequired: false
  podInfoOnMount: true
  fsGroupPolicy: None
  volumeLifecycleModes:
    - Persistent
