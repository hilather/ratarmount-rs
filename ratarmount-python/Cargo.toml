[package]
name = "ratarmount-python"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Python bindings for the ratarmount-rs Session API"

[lib]
name = "_native"
crate-type = ["rlib", "cdylib"]

[features]
default = []
python = ["dep:pyo3", "dep:secrecy"]
# Embedders opt in to interpreter initialization. Wheels use extension-module only.
embedding = ["python", "pyo3/auto-initialize"]
extension-module = ["python", "pyo3/extension-module"]

[dependencies]
ratarmount-session.workspace = true
pyo3 = { version = "=0.29.2", optional = true, default-features = false, features = ["macros", "abi3-py39"] }
secrecy = { version = "0.8", optional = true }

[dev-dependencies]
ratarmount-formats-tar.workspace = true
tempfile.workspace = true
